<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="子涵的个人中转页 · 生活明朗，万物可爱" />
  <meta name="theme-color" content="#0f1420" />
  <title>子涵 · 中转页</title>
  <link rel="icon" href="https://picx.zhimg.com/80/v2-cf221ada6f0705db976d2f5d44b74f10_720w.webp?source=1def8aca" />

  <!-- Font Awesome 图标 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <!-- 背景层（支持图片/视频） -->
  <div class="bg-layer" id="bgLayer"></div>
  <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="none"></video>
  <div class="bg-mask"></div>

  <!-- 右上角音乐播放器 -->
  <div class="music" id="musicPlayer" hidden>
    <button class="music-fab" id="musicFab" aria-label="音乐播放器" title="音乐">
      <img class="music-fab-cover" id="musicFabCover" src="" alt="" />
      <i class="fa-solid fa-music music-fab-icon"></i>
    </button>
    <div class="music-panel" id="musicPanel">
      <div class="music-cover-wrap">
        <img class="music-cover" id="musicCover" src="" alt="" />
      </div>
      <div class="music-meta">
        <div class="music-title" id="musicTitle">--</div>
        <div class="music-artist" id="musicArtist">--</div>
        <a class="music-id" id="musicId" href="#" target="_blank" rel="noopener" title="在网易云音乐中查看" hidden></a>
      </div>
      <div class="music-progress">
        <span class="music-time" id="musicCur">0:00</span>
        <input type="range" class="music-seek" id="musicSeek" min="0" max="100" value="0" step="0.1" aria-label="进度" />
        <span class="music-time" id="musicDur">0:00</span>
      </div>
      <div class="music-controls">
        <button id="musicPrev" aria-label="上一首"><i class="fa-solid fa-backward-step"></i></button>
        <button id="musicPlay" class="music-play" aria-label="播放/暂停"><i class="fa-solid fa-play"></i></button>
        <button id="musicNext" aria-label="下一首"><i class="fa-solid fa-forward-step"></i></button>
        <button id="musicListToggle" aria-label="播放列表" title="播放列表"><i class="fa-solid fa-list-ul"></i></button>
      </div>
      <div class="music-volume-row">
        <button id="musicMute" aria-label="静音"><i class="fa-solid fa-volume-high"></i></button>
        <input type="range" class="music-volume" id="musicVolume" min="0" max="1" step="0.01" value="0.7" aria-label="音量" />
      </div>
      <div class="music-list-wrap" id="musicListWrap" hidden>
        <div class="music-list-header">播放列表</div>
        <ul class="music-list" id="musicList"></ul>
      </div>
    </div>
    <audio id="musicAudio" preload="metadata"></audio>
  </div>

  <!-- 顶部提示 -->
  <div class="loading-tip" id="loadingTip"></div>

  <!-- 主卡片 -->
  <main class="stage">
    <section class="card">
      <img class="avatar" id="avatar" src="" alt="avatar" width="112" height="112" />
      <h1 class="name" id="name"></h1>
      <p class="subtitle" id="subtitle"></p>

      <p class="greeting" id="greeting"></p>
      <div class="clock" id="clock">--:--:--</div>

      <p class="description" id="description"></p>

      <blockquote class="hitokoto" id="hitokoto"></blockquote>

      <nav class="socials" id="socials" aria-label="社交链接"></nav>

      <a class="enter-btn" id="enterBtn" href="#" rel="noopener">进入博客</a>
    </section>
  </main>

  <!-- 切换背景 -->
  <button class="bg-switch" id="bgSwitch" title="换一张背景" aria-label="切换背景图">
    <i class="fa-solid fa-shuffle"></i>
  </button>

  <!-- 页脚 -->
  <footer class="footer">
    <span id="footerText"></span>
  </footer>

  <!-- 配置必须先加载 -->
  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
