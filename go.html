<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安全跳转 · 即将离开</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="https://picx.zhimg.com/80/v2-cf221ada6f0705db976d2f5d44b74f10_720w.webp?source=1def8aca" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    /* go.html 专用样式（继承 style.css 变量） */
    .go-card {
      width: 100%;
      max-width: 440px;
      padding: 40px 32px 32px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(var(--blur)) saturate(140%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
      box-shadow: var(--shadow);
      text-align: center;
      animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .warn-icon {
      width: 56px; height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: rgba(255,180,60,0.18);
      color: #ffb43c;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .go-card h1 {
      font-size: 22px;
      font-weight: 700;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
      margin-bottom: 8px;
    }
    .go-card .tip {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }
    .url-box {
      padding: 14px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 13px;
      word-break: break-all;
      color: var(--accent);
      margin-bottom: 10px;
      user-select: all;
      text-align: left;
    }
    .host-line {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 26px;
      text-align: center;
    }
    .host-line b { color: #ffb43c; }
    .go-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .go-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 36px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #10202e;
      background: linear-gradient(135deg, #ffffff 0%, #cfe8ff 100%);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(124,196,255,0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .go-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(124,196,255,0.55); }
    .go-btn:active { transform: translateY(0); }
    .go-btn-ghost {
      color: var(--text-soft);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: none;
    }
    .go-btn-ghost:hover { background: rgba(255,255,255,0.2); }
    .countdown {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 18px;
      min-height: 18px;
    }
    .countdown b { color: var(--accent); }
  </style>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-mask"></div>

  <main class="stage">
    <section class="go-card">
      <div class="warn-icon"><i class="fa-solid fa-link"></i></div>
      <h1>您即将离开本站</h1>
      <p class="tip">外部链接请注意安全，确认无误后再继续访问。</p>

      <div class="url-box" id="targetUrl"></div>
      <div class="host-line">目标域名：<b id="host">-</b></div>

      <div class="go-actions">
        <a class="go-btn" id="goBtn" href="#" rel="noopener noreferrer">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> 继续访问
        </a>
        <button class="go-btn go-btn-ghost" id="backBtn" type="button">
          <i class="fa-solid fa-arrow-left"></i> 返回
        </button>
      </div>
      <div class="countdown" id="countdown"></div>
    </section>
  </main>

<script>
(function () {
  'use strict';

  // 背景图（和 index.html 一致）
  function pickBg() {
    var list = (window.SITE_CONFIG && window.SITE_CONFIG.backgrounds) || [];
    if (!list.length) return 'https://imgbed.gzh-czy.cc.cd/9.jpg';
    return list[Math.floor(Math.random() * list.length)];
  }
  function setBg(url) {
    var layer = document.getElementById('bgLayer');
    if (!layer) return;
    var img = new Image();
    img.onload = function () {
      layer.style.backgroundImage = 'url("' + url + '")';
      layer.classList.add('loaded');
    };
    img.src = url;
  }
  setBg(pickBg());

  // 链接解析
  function parse(raw) {
    if (!raw) return null;
    raw = raw.trim();
    if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
    try {
      var u = new URL(raw, location.href);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
      return u;
    } catch (e) { return null; }
  }

  var urlEl = document.getElementById('targetUrl');
  var hostEl = document.getElementById('host');
  var goBtn = document.getElementById('goBtn');
  var backBtn = document.getElementById('backBtn');
  var cdEl = document.getElementById('countdown');

  var rawUrl = new URLSearchParams(location.search).get('url') || '';
  var target = parse(rawUrl);

  if (target) {
    urlEl.textContent = target.href;
    hostEl.textContent = target.hostname;
    goBtn.href = target.href;
  } else {
    urlEl.textContent = '（未提供有效链接）';
    hostEl.textContent = '-';
    goBtn.style.display = 'none';
  }

  // 倒计时跳转
  var AUTO_WAIT = 5;
  var timer = null;
  if (target && AUTO_WAIT > 0) {
    var left = AUTO_WAIT;
    cdEl.innerHTML = '将在 <b>' + left + '</b> 秒后自动跳转';
    timer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(timer);
        timer = null;
        window.location.href = target.href;
      } else {
        cdEl.innerHTML = '将在 <b>' + left + '</b> 秒后自动跳转';
      }
    }, 1000);
  }

  // 继续访问：停止倒计时
  goBtn.addEventListener('click', function () { if (timer) { clearInterval(timer); timer = null; } });

  // 返回按钮：智能回退
  backBtn.addEventListener('click', function () {
    if (timer) { clearInterval(timer); timer = null; }
    // 来源是同域则 back，否则回首页
    var ref = document.referrer;
    if (ref && ref.indexOf(location.hostname) > -1) {
      history.back();
    } else {
      window.location.href = 'index.html';
    }
  });
})();
</script>
</body>
</html>
